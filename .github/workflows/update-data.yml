name: Update stock data (JSON)

on:
  schedule:
    # 平日台灣時間 15:40（07:40 UTC）收盤後更新
    - cron: "40 7 * * 1-5"
  workflow_dispatch:
    inputs:
      lookback:
        description: "回補最近 N 個交易日"
        default: "5"
      heal:
        description: "個股缺口自癒（true/false）"
        default: "true"
      heal_budget_min:
        description: "heal 時間預算（分鐘）— 超過就停止，確保 export/commit 一定跑得到"
        default: "45"

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install pandas numpy requests psycopg2-binary pytz fastapi yfinance

      - name: Update DB (TWSE + TPEx daily K / chips / valuation)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python backend/daily_job.py \
            --lookback "${{ github.event.inputs.lookback || '5' }}" \
            --heal-budget-min "${{ github.event.inputs.heal_budget_min || '45' }}" \
            $([ "${{ github.event.inputs.heal || 'true' }}" = "true" ] && echo --heal)

      - name: Refresh AI screener lists
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -At -c "select public.ai_screen_refresh();"

      - name: Track new stocks (holdings + 加入追蹤 requests)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python backend/track_new.py --max 10

      - name: Export static JSON
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python backend/export_static_json.py --source db --workers 8

      - name: Commit & push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data backend/stocks.txt
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: daily update $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Notify failure (open GitHub issue → email)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create pipeline-failure -R "$REPO" --color B60205 --description "自動排程失敗" --force >/dev/null 2>&1 || true
          num=$(gh issue list -R "$REPO" --state open --label pipeline-failure --json number,title --jq "map(select(.title | contains(\"$WF\")))[0].number // empty")
          if [ -n "$num" ]; then
            gh issue comment "$num" -R "$REPO" --body "又失敗一次：$RUN_URL"
          else
            gh issue create -R "$REPO" --label pipeline-failure \
              --title "[排程失敗] $WF" \
              --body "@${{ github.repository_owner }} 自動排程「$WF」失敗。

          - 執行紀錄：$RUN_URL
          - 時間：$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')（台北）

          資料缺口會由下一次每日排程自動補（最近 5 個交易日 + 近 45 天缺口回補）。修好後請關閉此 issue。"
          fi
