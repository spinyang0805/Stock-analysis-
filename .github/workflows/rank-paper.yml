name: Monthly ranking (paper)

# Monthly "momentum + revenue growth" top-20 list, followed on paper (no real orders), and the daily
# 組合拳 (combo) candidates + paper positions used by the morning report and the website.
# The first run of each month ranks at that close; every run re-prices the unfinished months.
# Output public/data/rank_paper.json is committed to main (public data, no holdings) and shown on the site.
on:
  schedule:
    - cron: "0 11 * * 1-6"     # 19:00 Taipei, before daily-picks (19:30) so the morning report can mention it
  workflow_dispatch:
    inputs:
      force_rank:
        description: "rank today even if this month already has a list"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rank-paper
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install pandas numpy requests psycopg2-binary pytz pyarrow duckdb

      - name: Trading day?
        id: day
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import sys; sys.path.insert(0, "backend")
          from datetime import datetime, timedelta, timezone
          import trading_calendar as cal
          d = datetime.now(timezone(timedelta(hours=8))).strftime("%Y%m%d")
          print(f"trading={'true' if cal.is_trading_day(d) else 'false'}")
          EOF

      - name: Download data
        if: steps.day.outputs.trading == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -eu
          python backend/history_store.py pull
          python backend/history_store.py append --days 15     # latest days from Supabase (local only, no push)
          names=$(gh release view tuning-data --json assets -q '.assets[].name')
          [ -n "$names" ] && gh release download tuning-data -D history --clobber
          for a in $names; do [ -f "history/$a" ] || { echo "::error::missing tuning-data/$a"; exit 1; }; done

      - name: Rank / re-price
        if: steps.day.outputs.trading == 'true' || github.event_name == 'workflow_dispatch'
        run: >
          python backend/tuning/rank_paper.py --source parquet --adjust-source exchange
          ${{ github.event.inputs.force_rank == 'true' && '--force-rank' || '' }}

      - name: 組合拳 candidates / paper positions
        if: steps.day.outputs.trading == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true          # never blocks the ranking record
        run: python backend/tuning/combo_daily.py --source parquet --adjust-source exchange

      - name: Commit
        if: steps.day.outputs.trading == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/rank_paper.json
          [ -f public/data/combo_signals.json ] && git add public/data/combo_signals.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: monthly ranking + 組合拳 signals $(date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 10; done
          exit 1
