name: DB migrate (Supabase)

# 套用 supabase/migrations/*.sql（皆可重複執行），並做盤中報價冒煙測試。
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", ".github/workflows/db-migrate.yml"]
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::$f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done

      - name: Store Groq key in Vault (if secret set)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        if: env.GROQ_API_KEY != ''
        run: |
          umask 077
          printf '%s' "$GROQ_API_KEY" > /tmp/groq_key
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q <<'SQL'
          \o /dev/null
          \set key `cat /tmp/groq_key`
          select set_config('app.groq_key', :'key', false);
          do $$
          begin
            if exists (select 1 from vault.secrets where name = 'groq_api_key') then
              perform vault.update_secret((select id from vault.secrets where name = 'groq_api_key'), current_setting('app.groq_key'));
            else
              perform vault.create_secret(current_setting('app.groq_key'), 'groq_api_key');
            end if;
          end $$;
          SQL
          rm -f /tmp/groq_key
          echo "groq_api_key stored"

      - name: Smoke test market functions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # 以 anon 角色、3 秒逾時（與前端相同條件）呼叫
          AS_ANON="set statement_timeout = '3s'; set role anon;"
          psql "$DATABASE_URL" -At -c "$AS_ANON select public.market_quote(array['2330','6488'])->>'source';"
          psql "$DATABASE_URL" -At -c "$AS_ANON select jsonb_array_length(public.market_quote(array['2330','6488','0050'])->'quotes');"
          psql "$DATABASE_URL" -At -c "$AS_ANON select coalesce(jsonb_array_length(public.market_intraday('2330','1m','1d','上市')->'t'),0);"
          psql "$DATABASE_URL" -At -c "$AS_ANON select coalesce(jsonb_array_length(public.market_intraday('6488','5m','5d','上櫃')->'t'),0);"
          echo "--- intraday capture"
          psql "$DATABASE_URL" -At -c "select public.intraday_capture();"
          psql "$DATABASE_URL" -At -c "select jobname, schedule from cron.job order by jobname;"
          psql "$DATABASE_URL" -At -c "select code, count(*), max(minute) at time zone 'Asia/Taipei' from public.intraday_bars group by code order by 2 desc limit 5;"
          psql "$DATABASE_URL" -At -c "$AS_ANON select public.market_intraday('2330','1m','1d','上市')->>'source', jsonb_array_length(public.market_intraday('2330','1m','1d','上市')->'t');"
