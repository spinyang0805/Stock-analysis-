name: Track new stocks

# 前端「加入每日追蹤」按鈕寫入 track_requests；這裡每 20 分鐘檢查，有待處理才安裝套件與回補，
# 完成後 commit stocks.txt + 新股票 JSON，deploy-pages 透過 workflow_run 自動重新部署。
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      codes:
        description: "要加入追蹤的代號（逗號分隔，例：6488,3008）"
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data   # 與每日更新共用，避免同時 push
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Any pending requests?
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CODES: ${{ github.event.inputs.codes }}
        run: |
          for c in $(echo "$CODES" | tr ',' ' '); do
            if echo "$c" | grep -Eq '^[0-9A-Z]{4,6}$'; then
              psql "$DATABASE_URL" -q -c "insert into public.track_requests(code, status) values ('$c', 'pending') on conflict (code) do update set status = 'pending', message = null, done_at = null"
            fi
          done
          n=$(psql "$DATABASE_URL" -At -c "select count(*) from public.track_requests where status = 'pending'" 2>/dev/null || echo 0)
          echo "pending=$n"
          echo "pending=$n" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.check.outputs.pending != '0'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.pending != '0'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        if: steps.check.outputs.pending != '0'
        run: pip install pandas numpy requests psycopg2-binary pytz fastapi yfinance

      - name: Backfill requested stocks
        id: track
        if: steps.check.outputs.pending != '0'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python backend/track_new.py --requests-only --max 5 | tee /tmp/track.log
          echo "codes=$(tail -n 1 /tmp/track.log)" >> "$GITHUB_OUTPUT"

      - name: Export new stocks
        if: steps.track.outputs.codes != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python backend/export_static_json.py --source db --only "${{ steps.track.outputs.codes }}" --workers 4

      - name: Commit & push
        if: steps.track.outputs.codes != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data backend/stocks.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: track ${{ steps.track.outputs.codes }}"
            git pull --rebase origin main
            git push
          fi

      - name: Notify failure (open GitHub issue → email)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create pipeline-failure -R "$REPO" --color B60205 --description "自動排程失敗" --force >/dev/null 2>&1 || true
          num=$(gh issue list -R "$REPO" --state open --label pipeline-failure --json number,title --jq "map(select(.title | contains(\"$WF\")))[0].number // empty")
          if [ -n "$num" ]; then
            gh issue comment "$num" -R "$REPO" --body "又失敗一次：$RUN_URL"
          else
            gh issue create -R "$REPO" --label pipeline-failure \
              --title "[排程失敗] $WF" \
              --body "@${{ github.repository_owner }} 自動排程「$WF」失敗。

          - 執行紀錄：$RUN_URL
          - 時間：$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')（台北）

          資料缺口會由下一次每日排程自動補（最近 5 個交易日 + 近 45 天缺口回補）。修好後請關閉此 issue。"
          fi
