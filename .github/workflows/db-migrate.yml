name: DB migrate (Supabase)

# 套用 supabase/migrations/*.sql（皆可重複執行），並做盤中報價冒煙測試。
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", ".github/workflows/db-migrate.yml"]
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::$f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done

      - name: Store Groq key in Vault (if secret set)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        if: env.GROQ_API_KEY != ''
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -v key="$GROQ_API_KEY" <<'SQL'
          \o /dev/null
          select set_config('app.groq_key', :'key', false);
          do $$
          begin
            if exists (select 1 from vault.secrets where name = 'groq_api_key') then
              perform vault.update_secret((select id from vault.secrets where name = 'groq_api_key'), current_setting('app.groq_key'));
            else
              perform vault.create_secret(current_setting('app.groq_key'), 'groq_api_key');
            end if;
          end $$;
          SQL
          echo "groq_api_key stored"

      - name: Smoke test market functions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -At -c "select payload_source from (select public.market_quote(array['2330','6488'])->>'source' as payload_source) s;"
          psql "$DATABASE_URL" -At -c "select jsonb_array_length(public.market_quote(array['2330','6488'])->'quotes');"
          psql "$DATABASE_URL" -At -c "select coalesce(jsonb_array_length(public.market_intraday('2330','1m','1d')->'t'),0);"
          echo "--- diagnostics"
          psql "$DATABASE_URL" -At -c "select status, left(body,160) from public._market_get('https://mis.twse.com.tw/stock/api/getStockInfo.jsp?json=1&delay=0&ex_ch=tse_2330.tw', 5000);"
          psql "$DATABASE_URL" -At -c "select status, left(body,160) from public._market_get('https://query1.finance.yahoo.com/v8/finance/chart/2330.TW?interval=1d&range=1d', 5000);"
          psql "$DATABASE_URL" -At -c "select status, left(body,120) from public._market_get('https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY?date=20261001&stockNo=2330&response=json', 5000);"
          psql "$DATABASE_URL" -At -c "select status, left(body,80) from public._market_get('https://example.com/', 5000);"
