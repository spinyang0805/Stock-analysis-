name: Research (entry timing / value dips)

# One-off research runs on the full history (read-only). The Markdown report is shown in the run summary and
# kept as an artifact.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "history years"
        default: "8"
      script:
        description: "research script"
        type: choice
        options: [research_entry, research_s2s, research_codex]
        default: research_entry

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
      YEARS: ${{ github.event.inputs.years || '8' }}
      SCRIPT: ${{ github.event.inputs.script || 'research_entry' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install pandas numpy requests psycopg2-binary pytz pyarrow duckdb
      - name: Download data
        run: |
          set -eu
          case "$YEARS" in ''|*[!0-9]*) echo "years must be numeric"; exit 1;; esac
          python backend/history_store.py pull
          gh release view tuning-data --json assets -q '.assets[].name' > /tmp/a.txt
          [ -s /tmp/a.txt ] && gh release download tuning-data -D history --clobber
          mkdir -p history/out
          gh release download tuning-out -p stock_params.json -D history/out --clobber
      - name: Research
        run: >
          python "backend/tuning/$SCRIPT.py" --source parquet --universe 500 --years "$YEARS"
          --adjust-source exchange --workers 4
      - name: Report
        if: always()
        run: '[ -f "history/out/$SCRIPT.md" ] && cat "history/out/$SCRIPT.md" >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.SCRIPT }}
          path: history/out/${{ env.SCRIPT }}.md
          if-no-files-found: ignore
